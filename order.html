<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            Zestora
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="menu.html">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="order.html">Order</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- Order Header -->
<section class="bg-dark text-white text-center py-5">
    <div class="container">
        <h1>Place Your Order</h1>
        <p>Enjoy delicious food from Zestora</p>
    </div>
</section>


<!-- Order Form -->
<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        Order Food 🍽️
                    </h2>

                    <form id="orderForm">

                        <!-- Customer Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input type="text"
                                   id="customerName"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <!-- Select Food -->
                        <div class="mb-3">

                            <label class="form-label">
                                Select Food
                            </label>

                            <select id="food"
                                    class="form-select"
                                    required>

                                <option value="">
                                    -- Select Food --
                                </option>

                                <option value="Margherita Pizza">
                                    Margherita Pizza - ₹199
                                </option>

                                <option value="Classic Burger">
                                    Classic Burger - ₹149
                                </option>

                                <option value="Creamy Pasta">
                                    Creamy Pasta - ₹179
                                </option>

                                <option value="French Fries">
                                    French Fries - ₹99
                                </option>

                                <option value="Cheese Sandwich">
                                    Cheese Sandwich - ₹129
                                </option>

                                <option value="Chocolate Cake">
                                    Chocolate Cake - ₹149
                                </option>

                            </select>

                        </div>


                        <!-- Quantity -->
                        <div class="mb-3">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   id="quantity"
                                   class="form-control"
                                   min="1"
                                   value="1"
                                   required>

                        </div>


                        <!-- Address -->
                        <div class="mb-3">

                            <label class="form-label">
                                Delivery Address
                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      placeholder="Enter your delivery address"
                                      required></textarea>

                        </div>


                        <!-- Payment Method -->
                        <div class="mb-4">
                            <label class="form-label">
                                Payment Method
                            </label>

                            <select class="form-select" required>

                                <option value="">
                                    -- Select Payment Method --
                                </option>

                                <option>
                                    Cash on Delivery
                                </option>

                                <option>
                                    UPI
                                </option>

                                <option>
                                    Credit / Debit Card
                                </option>

                            </select>

                        </div>
                        <!-- Total -->
                        <div class="text-center mb-4">
                            <h5>Total Amount: ₹<span id="total">0</span></h5>
                        </div>

                        <!-- Button -->
                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-warning btn-lg px-5">
                                    Place Order

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 Zestora Restaurant | Taste That Makes You Smile
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
